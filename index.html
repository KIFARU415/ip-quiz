<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ═══════════════════ 관리자 수정 안내 ═══════════════════
     1) 문제 추가/수정/삭제 : HTML 안의 "문항 은행 시작/끝" 표식 사이의 목록만 수정합니다.
        → 함께 제공된 "문제관리도구.html"을 쓰면 코드를 건드리지 않고 문항을 관리할 수 있습니다.
     2) 색상 변경 : 아래 :root 안의 색상 값(--navy 남색, --gold 금색, --paper 배경 등)을 수정합니다.
     3) 기관명·전화번호 : 상단 .org의 <span> 문구와 하단 footer의 전화번호를 수정합니다.
     ※ 수정 후에는 파일을 저장해서 호스팅 사이트에 다시 올리면 즉시 반영됩니다.

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="중소기업 영업비밀 보호 자가진단 테스트 - 비공지성, 경제적 유용성, 비밀관리성, 사후대응 10문항 무작위 진단">
<title>영업비밀 보호 자가진단 테스트</title>
<style>
:root{
  /* ▼▼ 색상은 여기서 바꿀 수 있습니다 ▼▼ */
  --navy:#0c2238;   /* 메인 남색 (상단바) */
  --navy-2:#14365c; /* 남색 보조 (버튼) */
  --navy-3:#1d4a7a; /* 남색 보조 2 */
  --gold:#c9a227;   /* 포인트 금색 */
  --gold-2:#e3bf52; /* 금색 밝은 톤 */
  --paper:#f5f2ea;  /* 화면 배경색 */
  --card:#ffffff; --ink:#22303f; --muted:#66748a;
  --line:#e4ddcc; --ok:#34d399; --ok-bg:rgba(52,211,153,.16); --bad:#f87171; --bad-bg:rgba(248,113,113,.15);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(157,182,214,.25)}
html{scroll-behavior:smooth}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  background:linear-gradient(180deg,#0d2547 0%,#0a1e3a 55%,#081831 100%); color:#eef3f9; line-height:1.6; min-height:100dvh;
  display:flex; flex-direction:column;
}
/* ── 상단 바 ───────────────────────── */
.topbar{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff; padding:18px 16px 16px; text-align:center;
  border-bottom:1px solid rgba(255,255,255,.16);
}
.topbar .org{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:700;letter-spacing:.04em}
.topbar .org svg{width:20px;height:20px;flex:none}
.topbar .org-en{font-size:10px;letter-spacing:.16em;color:#93aac9;margin-top:3px;font-weight:600}
/* ── 공통 ───────────────────────── */
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:20px 16px 32px}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.btn{
  display:block;width:100%;min-height:62px;border:none;border-radius:3px;
  font-size:20.5px;font-weight:800;letter-spacing:.02em;
}
.btn:active{transform:translateY(1px)}
.btn-gold{background:#ffffff;color:#0d2242;box-shadow:0 2px 0 rgba(4,12,26,.5), inset 0 0 0 1px rgba(13,34,66,.14)}
.btn-navy{background:#ffffff;color:#0d2242;box-shadow:0 2px 0 rgba(4,12,26,.5), inset 0 0 0 1px rgba(13,34,66,.14)}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#c9d4e2;font-weight:600;min-height:48px;margin-top:10px}
button:focus-visible{outline:3px solid #9db6d6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ── 시작 화면 ───────────────────────── */
.eyebrow{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.22em;margin-bottom:10px}
h1{font-size:34px;line-height:1.34;font-weight:900;letter-spacing:-.01em}
.lede{margin-top:14px;color:var(--muted);font-size:17.5px}
.impact{
  margin:20px 0;display:flex;gap:14px;align-items:stretch;
  background:linear-gradient(135deg,var(--navy),var(--navy-2));
  border-radius:var(--radius);padding:18px 16px;color:#fff;
  border:1px solid var(--navy-3);box-shadow:0 2px 6px rgba(12,34,56,.18);
}
.impact .im-art{flex:none;width:86px;display:flex;align-items:center;justify-content:center;color:var(--gold-2)}
.impact .im-art svg{width:84px;height:84px}
.impact .im-body{flex:1;min-width:0}
.impact .im-label{font-size:12px;font-weight:800;color:var(--gold-2);letter-spacing:.08em;margin-bottom:4px}
.impact .im-stat{font-size:16.5px;font-weight:800;line-height:1.55}
.impact .im-stat b{color:var(--gold-2);font-size:20px}
.impact .im-note{font-size:12.5px;color:#c9d4e2;margin-top:6px;line-height:1.5}
@media (max-width:430px){.impact{flex-direction:column;align-items:center;text-align:center}}
.howto{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:14px 16px;font-size:15px;color:var(--muted);margin-bottom:20px;
}
.howto b{color:var(--navy-2)}
/* ── 퀴즈 화면 ───────────────────────── */
.q-head{display:flex;justify-content:flex-end;align-items:center;margin-bottom:8px}
.q-count{font-size:15px;font-weight:700;color:#93aac9;font-variant-numeric:tabular-nums}
.progress{height:6px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;margin-bottom:18px}
#progress-fill{height:100%;width:0;background:#9db6d6;border-radius:999px}
#q-text{font-size:26px;font-weight:800;line-height:1.5;letter-spacing:-.01em;margin-bottom:16px;color:#ffffff}
#q-options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);border-radius:12px;
  padding:16px 16px;font-size:19.5px;line-height:1.55;color:#eef3f9;min-height:62px;
}
.opt .opt-no{font-weight:800;color:#9db6d6;flex:none;line-height:1.5}
.opt.is-correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.is-correct .opt-no{color:var(--ok)}
.opt.is-wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.is-wrong .opt-no{color:var(--bad)}
.opt:disabled{cursor:default}
#q-explain{
  margin-top:16px;background:rgba(255,255,255,.05);border-left:4px solid #9db6d6;
  border-radius:0 12px 12px 0;padding:14px 16px;
}
#explain-tag{font-weight:800;font-size:16px;margin-bottom:6px}
#explain-tag.ok{color:var(--ok)} #explain-tag.bad{color:var(--bad)}
#explain-text{font-size:18px;color:#c9d4e2;line-height:1.7}
#explain-answers{margin-bottom:8px}
.ea-line{font-size:16px;font-weight:600;margin-bottom:4px}
.ea-line b{font-weight:800}
.ea-line.ea-ok b{color:var(--ok)}
.ea-line.ea-bad b{color:var(--bad)}
.q-nav{display:flex;gap:10px;margin-top:18px}
.q-nav .btn{margin-top:0}
.btn-backnav{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.30);color:#dbe7f5}
/* ── 결과 화면 ───────────────────────── */
.score-wrap{position:relative;width:150px;margin:6px auto 4px}
.ring{width:150px;height:150px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring-bg{stroke:rgba(255,255,255,.15)}
#ring-fg{stroke:url(#goldGrad);stroke-dasharray:326.7;stroke-dashoffset:326.7}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num b{font-size:50px;font-weight:900;color:#ffffff;line-height:1;font-variant-numeric:tabular-nums}
.score-num span{font-size:12.5px;color:#93aac9;letter-spacing:.2em;margin-top:4px}
#grade-stamp{
  width:fit-content;min-width:130px;max-width:90%;margin:14px auto 4px;padding:8px 18px;text-align:center;
  border:3px double #9db6d6;border-radius:10px;color:#eef3f9;
  font-size:20px;font-weight:900;letter-spacing:.06em;transform:rotate(-4deg);
  background:rgba(255,255,255,.06);
}
#grade-stamp.low{border-color:var(--bad);color:var(--bad)}
#grade-msg{text-align:center;color:#93aac9;font-size:16.5px;max-width:400px;margin:10px auto 0}
#cat-stats{margin:24px 0 8px}
.btns{margin-top:22px}
/* ── 하단 ───────────────────────── */
footer{
  background:#081831;border-top:1px solid rgba(255,255,255,.12);color:#a9b8ca;font-size:13px;line-height:1.7;
  padding:16px 20px 26px;text-align:center;
}
footer b{color:#d8e0ea;font-weight:700}
footer .gold{color:#9db6d6}
/* ── 시작 화면: 인크 편집 디자인 (모션 없음) ───────── */
body.mode-start .topbar{display:none}
body.mode-start footer{display:none}
body.mode-start main{padding:0;max-width:none}
#screen-start{
  min-height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0d2547 0%,#0a1e3a 55%,#081831 100%);
  color:#eef3f9;
}
.hero-top{display:none}
#screen-start::before{
  content:"";position:absolute;inset:12px;pointer-events:none;
  border:1px solid rgba(255,255,255,.16);border-radius:3px;
}
#screen-start::after{
  content:"";position:absolute;inset:12px;pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) left top,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) left top,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) right top,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) right top,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) left bottom,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) left bottom,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) right bottom,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) right bottom;
  background-size:20px 2px,2px 20px,20px 2px,2px 20px,20px 2px,2px 20px,20px 2px,2px 20px;
  background-repeat:no-repeat;
}
.hero-inner{
  flex:1;width:100%;max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px 26px 44px;
}
.hero-rule{width:44px;border-top:1px solid rgba(255,255,255,.4);margin-bottom:30px;position:relative}
.hero-rule::after{
  content:"";position:absolute;left:50%;top:-3.5px;width:6px;height:6px;
  transform:translateX(-50%) rotate(45deg);background:#0d2547;
  box-shadow:0 0 0 1px rgba(255,255,255,.45);
}
.hero-inner .eyebrow{
  color:#9db6d6;font-size:18px;font-weight:700;letter-spacing:.34em;text-indent:.34em;
  margin:0 0 20px;
}
.hero-inner h1{
  font-family:"Noto Serif KR","Nanum Myeongjo","Batang","BatangChe",serif;
  color:#ffffff;font-size:clamp(54px,15vw,72px);font-weight:900;
  line-height:1.18;letter-spacing:.005em;margin:0;
}
.hero-meta{
  margin-top:24px;font-size:19px;color:#93aac9;font-weight:600;letter-spacing:.04em;
}
.hero-meta b{color:#e8f0fa;font-weight:800}
.btn-hero{
  display:block;width:min(340px,88%);min-height:78px;border:none;border-radius:6px;
  background:#ffffff;color:#0d2242;font-size:21px;font-weight:800;letter-spacing:.08em;
  margin:46px auto 0;cursor:pointer;border-radius:3px;box-shadow:0 2px 0 rgba(4,12,26,.5), inset 0 0 0 1px rgba(13,34,66,.14);
}
.btn-hero:active{background:#e8eef6}
.btn-hero:focus-visible{outline:3px solid #9db6d6;outline-offset:3px}
.hero-band{
  flex:none;background:#ffffff;border-top:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;gap:14px;text-align:left;
  padding:16px 20px calc(16px + env(safe-area-inset-bottom));
}
.hero-band img{width:54px;height:54px;flex:none;object-fit:contain}
.hero-band .hb-name{font-size:17.5px;font-weight:800;color:var(--navy);line-height:1.3;letter-spacing:.01em}
.hero-band .hb-sub{font-size:14.5px;color:var(--muted);margin-top:4px;line-height:1.5}
body:not(.mode-start)::before{content:"";position:fixed;inset:12px;pointer-events:none;z-index:60;border:1px solid rgba(255,255,255,.16);border-radius:3px}
/* ==== 사용자 스타일 시작 ==== */

</style>
</head>

  {q:"다음 중 부정경쟁방지법상 '영업비밀'의 성립요건으로 바르게 묶인 것은?", o:["비공지성 · 가치성(경제적 유용성) · 비밀관리성", "신규성 · 진보성 · 산업상 이용가능성", "등록 · 심사 · 공고", "공개성 · 독점성 · 항구성"], a:0, ex:"영업비밀은 \"사업활동에 유용한 기술상 또는 경영상의 정보로서 비밀로 관리된 것\"(제2조 제2호)이다. ②는 특허의 요건이고, ③과 ④는 법에 없는 요건이다. 특허와 달리 등록·심사 없이 이 세 가지를충족하면 곧바로 법의 보호를 받는다."},
  {q:"영업비밀과 특허의 차이에 대한 설명으로 옳은 것은?", o:["영업비밀도 특허처럼 관청에 등록해야 보호받는다", "영업비밀은 20년의 보호기간이 끝나면 누구나 쓸 수 있다", "영업비밀은 비밀을 유지하는 한 보호기간의 제한 없이 보호된다", "영업비밀은 특허와 달리 신규성이 있어야 보호된다"], a:2, ex:"영업비밀은 등록이 필요 없고 보호기간 제한도 없다. 코카콜라 배합비처럼 비밀만 지켜지면 수십년을 보호받을 수 있다. 대신 공개되는 순간 보호가 끝난다는 것이 특허와의 핵심 차이다. ②는 특허(20년)의설명이다."},
  {q:"A사는 '주요 고객 300곳의 연락처'를 전 직원이 언제든 열람할 수 있는 공용 폴더에 별도 표기 없이 두었다. 이직한 직원이 이 목록을 경쟁사에 가져가 사용했다. 법원이 영업비밀로 인정하지 않을 가능성이 높은 이유는?", o:["고객 연락처는 영업비밀의 대상이 될 수 없기 때문에", "비밀로 관리하겠다는 조치가 없어 비밀관리성이 인정되지 않기 때문에", "고객 연락처는 기술상의 정보가 아니기 때문에", "이직 자체가 불법이기 때문에"], a:1, ex:"비밀관리성 요건이 문제다. 보호의사를 겉으로 드러내는 합리적 조치(기밀 표기, 접근권한 제한,비밀유지계약 등)가 없으면 아무리 중요한 정보라도 영업비밀로 보호되지 않는다(대법원 96다31574 법리,대법원 2017도13792: 누구나 볼 수 있는 곳에 개방된 정보는 비밀관리성 부정). ①③은 틀렸다 — 고객명단같은 '경영상의 정보'도 영업비밀이 될 수 있다."},
  {q:"다음 중 영업비밀에 해당하기 '가장 어려운' 것은?", o:["외부에 공개된 적 없는 라면 조리법(배합비)", "'대외비' 표기와 함께 소수 인원만 보는 거래처별 단가 견적서", "접근이 통제된 신약 후보물질 연구데이터", "회사 1층 게시판과 홈페이지에 공개되어 있는 영업시간 안내"], a:3, ex:"이미 공개된 정보는 비공지성 요건이 결여되어 영업비밀이 될 수 없다. ①②③은 비밀로 관리되는 비공개 정보라서, 사업활동에 유용하다면 영업비밀이 될 수 있다."},
  {q:"비공지성 요건에 대한 설명으로 옳은 것은?", o:["사내 직원 한 명이 읽은 정보는 더 이상 영업비밀이 될 수 없다", "업계에서 통상 쉽게 알 수 없고, 공개 자료에서 바로 알 수 없는 정보여야 한다", "특허공보에 공개된 기술도 회사가 비밀이라고 주장하면 영업비밀로 보호된다", "신문 기사로 보도된 내용도 사내 규정에 '기밀'이라고 적혀 있으면 영업비밀이다"], a:1, ex:"비공지성은 \"공연히 알려져 있지 않을 것\"이다. 이미 특허공보·신문 등으로 공개된 정보는 비밀관리를 아무리 했다고 주장해도 영업비밀이 아니다(③④ 오답). 반면 ①은 틀렸다 — 열람 권한이 있는 내부직원이 아는 것은 '공개'가 아니므로 비공지성이 유지된다."},
  {q:"가치성(경제적 유용성) 요건에 대한 설명으로 옳은 것은?", o:["현재 사용 중이 아니어도 미래의 사업활동에 유용할 가능성이 있으면 인정될 수 있다", "회사가 돈을 주고 구입한 정보만 가치성이 인정된다", "특허로 등록할 수 있는 수준의 기술이어야 가치성이 있다", "유통기한이 지난 오래된 정보만 가치성이 인정된다"], a:0, ex:"가치성은 \"사업활동에 유용할 것\"이면 족하다. 지금 당장 생산에 쓰지 않는 기술이라도 앞으로사업에 활용할 가치가 있으면 영업비밀이 될 수 있다. 돈을 주고 산 것인지, 특허 수준인지는 요건이 아니다."},
  {q:"다음 중 영업비밀 '침해행위'에 해당하는 것은?", o:["퇴직 후 자기가 일반적으로 습득한 지식·기술을 활용하는 행위", "정보 보유자와 정당한 라이선스 계약을 맺어 기술을 사용하는 행위", "비밀유지의무를 진 변호사·회계사 등이 알게 된 영업비밀을 의무 위반으로 누설한 행위", "시판 제품을 분석(역설계)해 알아낸 정보를 사용하는 행위"], a:2, ex:"영업비밀을 적법하게 접촉한 자가 그 의무(비밀유지의무·계약상 의무)를 위반해 취득·사용·누설하는 것은 침해행위다(제2조 제3호 (나)목). ①(퇴직자의 일반 지식·기술), ②(정당한 허락에 의한 사용), ④(역설계)는 적법하다."},
  {q:"다음 중 영업비밀의 '부정취득'에 해당하지 '않는' 것은?", o:["회사 사무실에 몰래 들어가 서류를 훔쳐 가는 행위", "허가받지 않고 타인의 계정으로 기밀 폴더를 열람하는 행위", "사기를 써서 상대방을 속이고 기술자료를 넘겨받는 행위", "정보 보유자와 정당한 계약을 맺고 허락을 받아 정보를 사용하는 행위"], a:3, ex:"절도·무단열람·사기·협박 등 '부정한 방법'으로 취득해야 부정취득이다(제2조 제3호 (가)목). 정보 보유자의 정당한 허락(라이선스 계약 등)을 받아 사용하는 것은 침해행위가 아니다."},
  {q:"퇴직자와 영업비밀에 대한 설명으로 옳은 것은?", o:["퇴직하면 근무 중 알게 된 모든 회사 정보를 자유롭게 사용할 수 있다", "퇴직자도 자기가 취업 전부터 갖고 있던 지식·기술이나 일반적으로 습득한 기술은 자유롭게 사용할 수 있다", "퇴직자는 영원히 같은 업계에 취업할 수 없다", "퇴직자가 머리로 기억한 내용을 사용하면 항상 영업비밀 침해가 된다"], a:1, ex:"대법원 98다1928은 퇴직자가 취업 전부터 보유한 지식·기술과 그 가치와 무관하게 일반적으로습득한 지식·기술은 자유로이 사용할 수 있다고 본다. 다만 그 범위를 넘어 회사의 영업비밀(비밀로 관리된고객명단, 도면, 배합비 등)을 사용하면 침해가 된다(①④ 오답)."},
  {q:"퇴사를 앞둔 직원이 회사 고객 DB를 개인 USB에 무단 복사해 이직 회사에서 사용했다. 법적 평가로 옳은 것은?", o:["무단 복사는 '부정취득'이고, 이를 이직처에서 사용하면 침해행위가 될 수 있다", "USB에 담아 두는 것만으로는 어떤 법적 문제도 생기지 않는다", "머리로 기억한 것이 아니므로 침해가 성립하지 않는다", "회사 규모가 크면 침해가 성립하지 않는다"], a:0, ex:"허락 없이 고객 DB를 복사해 가져가는 것은 부정취득이고, 이를 사용하면 침해행위가 된다. '머리로 기억한 것 vs 복사한 것'의 차이가 아니라, 그 정보가 비밀로 관리되던 영업비밀인지가 기준이다. 실무적으로도 퇴사자의 반출 시도는 가장 흔한 유출 경로라 사전 관리가 중요하다."},
  {q:"어떤 회사가 이미 영업비밀임을 알면서(또는 중대한 과실로 알지 못한 채) 다른 회사에서 '부정하게 취득된' 정보를 넘겨받아 사용했다. 설명으로 옳은 것은?", o:["직접 훔친 것이 아니므로 아무 책임도 없다", "민사 책임만 있고 형사 책임은 없다", "회사 내부자가 아니면 형사 처벌 대상이 아니다", "그 자신도 침해행위(취득·사용)의 책임을 질 수 있다"], a:3, ex:"제2조 제3호 (다)목은 '부정취득 사실을 알면서(또는 중대한 과실로 알지 못한 채) 취득·사용'하는 것도 규제한다. 중개자·거래상대방도 그대로 책임질 수 있어서, 2027년 시행 예정 개정안은 이런 '영업비밀 브로커' 처벌을 더 강화할 예정이다."},
  {q:"2024년 개정으로 신설된 '데이터 침해행위' 규제(제3조의2)의 특징으로 옳은 것은?", o:["공개되어 있는 데이터는 어떤 경우에도 규제할 수 없다", "영업비밀과 요건이 완전히 동일하다", "영업비밀 3요건을 충족하지 않는 데이터라도, 해킹 등으로 부정하게 취득·사용하면 규제할 수 있다", "접근 권한이 있는 자가 정당하게 다룬 데이터까지 규제한다"], a:2, ex:"기존에는 영업비밀 3요건(비공지성 등)을 채우지 못하는 데이터는 보호가 어려웠다. 제3조의2는영업비밀과 분리하여, 해킹·무단열람 등 '부정한 접근'으로 취득·사용·유출되는 중요 데이터를 별도로 규율한다. 정당한 권한으로 다룬 데이터(④)는 규제 대상이 아니다."},
  {q:"다음 중 우리나라에서 영업비밀(노하우)을 보호하는 방법에 대한 설명으로 옳지 '않은' 것은?", o:["부정경쟁방지법상 손해배상 청구와 형사처벌로 보호받을 수 있다", "특허 출원을 하지 않아도 특허법으로 노하우가 보호된다", "상대방과 맺은 비밀유지계약(NDA) 위반에 대해 계약책임을 물을 수 있다", "민법상 불법행위(위자료·손해배상) 책임을 물을 수 있다"], a:1, ex:"특허법 보호는 '출원·등록'이 전제다. 등록 없이 비밀로 관리되는 노하우는 부정경쟁방지법·계약·민법으로 보호한다. 실무에서는 두 제도를 함께 씌어 두는 경우가 많다(핵심은 특허로, 공정은 영업비밀로)."},
  {q:"다음 정보 중 영업비밀로 보호되기 '가장 어려운' 것은?", o:["회사 앞 대형 전광판에 상시 게시하는 신제품 출시일 안내", "사내 대장(帳冊)에만 보관되는 원가 구성 내역", "특정 임원만 접근 가능한 M&A 후보 기업 목록", "공장 지하 금고에 보관된 마스터 포뮬러"], a:0, ex:"전광판에 상시 게시된 정보는 공연히 알려진 것이라 비공지성이 결여된다. ②③④처럼 접근을 통제한 비공개 정보는 (유용성만 충족하면) 영업비밀이 될 수 있다."},
  {q:"비밀관리성 판단에 관한 설명으로 옳은 것은? (대법원 2021다289399)", o:["어느 경우든 공장 전체에 출입통제가 없으면 비밀관리성이 부정된다", "문서에 '기밀' 도장만 찍으면 무조건 인정된다", "보안조치의 구체적 수단·정도는 정보의 종류·내용과 침해 가능성에 따라 달라지므로, 모든 영업비밀에 동일한강도의 조치가 요구되는 것은 아니다", "여러 회사가 함께 보유한 정보는 비밀관리성이 인정될 수 없다"], a:2, ex:"비밀관리성은 '합리적인 관리 조치'면 족하고, 그 수단·강도는 정보의 성격과 침해위험에 맞게 판단한다. 같은 판결은 여러 회사가 공동으로 보유한 정보라도 각 보유자가 각자 관리하면 족하다고 본다(④오답)."},
  {q:"신입 직원 입사 시 비밀관리를 위해 가장 기본적으로 해야 할 일은?", o:["입사 후 1년간 사내 게시판 접근을 차단한다", "비밀유지계약(NDA)을 체결하고 보안교육으로 '무엇이 비밀이고 어떻게 다루는지' 알려 준다", "보안은 정보보안팀 전담이므로 일반 직원은 알 필요가 없다", "비밀유지계약은 퇴사할 때쯤 체결해도 늦지 않다"], a:1, ex:"사람이 정보를 다루는 만큼, '입사 시 계약 + 교육'이 비밀관리의 출발점이다. 계약과 교육 기록은나중에 비밀관리성을 다툴 때도 회사가 관리했던 증거가 된다. ①④는 시기가 부적절하고 ③은 비밀관리를특정 부서에만 맡기는 대표적 실수다."},
  {q:"사내 문서를 비밀관리하는 방법으로 가장 적절한 것은?", o:["모든 문서를 하나로 묶어 동일한 방식으로 보관한다", "중요 문서일수록 사본을 많이 만들어 여러 곳에 흩어 둔다", "보안 점검은 감사 시즌에만 하면 충분하다", "중요도에 따라 등급(예: 대외비·기밀·극비)을 나누고, 등급별로 표기·열람권한·보관방식을 정한다"], a:3, ex:"등급 구분 + 표기 + 열람권한 통제가 문서 비밀관리의 기본이다. '기밀' 표기만 있으면 끝이 아니라(문제 15 참조), 실제 열람권한·보관이 표기와 일치해야 법원에서도 신뢰받는다."},
  {q:"직원 퇴사 시 비밀관리 절차로 가장 바람직한 것은?", o:["퇴사 면담에서 비밀유지의무를 다시 안내하고, 시스템 접근권한 회수와 회사자료 반출 여부 점검을 마친 뒤 퇴사를 확정한다", "퇴사한 지 6개월이 지난 뒤에 접근권한을 회수한다", "개인 기기는 확인할 수 없으니 아무 조치도 하지 않는다", "퇴사 사실을 취업 예정 경쟁사에 바로 통보한다"], a:0, ex:"퇴사자 관리는 유출 예방의 핵심이다. 면담(비밀유의무 재확인) → 접근권한 회수 → 기기·자료반출 점검 → 필요시 퇴사자 보안서약 체결의 순서가 표준이다. ②처럼 권한 회수를 늦추면 퇴사 직전 대량복사의 여지가 남는다."},
  {q:"공동개발 파트너에게 우리 핵심 공정을 보여 줘야 하는 상황이다. 가장 바람직한 조치는?", o:["신뢰를 쌓기 위해 전체 공정을 처음부터 한 번에 공개한다", "구두로 '비밀 지켜 달라'고 부탁한다", "상호 비밀유지계약(NDA)을 먼저 체결하고, 목적에 필요한 최소한의 정보만 단계적으로 공개한다", "계약서에 위약벌 조항만 넣고 다른 관리 조치는 하지 않는다"], a:2, ex:"대외 공개는 유출의 대표적 경로다. NDA 체결 → 공개 범위·목적·기간 명시 → 단계적 공개 순으로 관리하고, 공개한 자료에는 관리번호·반환 조건을 두는 것이 안전하다."},
  {q:"음료 제조의 핵심 배합비 정보에 대한 접근권한을 설계할 때 올바른 원칙은?", o:["업무 효율을 위해 연구원·생산직 전원에게 개방한다", "필요한 최소한의 인원에게만, 단계적으로 접근을 허용한다(최소 권한 원칙)", "비밀번호는 전 직원이 같은 것을 공유한다", "접속 기록은 관리 부담이 되므로 남기지 않는다"], a:1, ex:"'필요한 자에게만, 기록을 남기며' 접근을 허용하는 것이 원칙이다. 접속기록은 문제가 생겼을 때누가 언제 무엇을 봤는지 증명해 주는 핵심 증거가 되므로 반드시 남겨 둔다(④ 오답)."},
  {q:"중요 정보의 외부 반출·전송에 대한 통제 방법으로 가장 적절한 것은?", o:["반출 금지 규정만 세워 두고 별도 점검은 하지 않는다", "개인 메일로 백업해 두면 사실상 안전하다", "USB 사용만 차단하면 그 이상의 관리는 불필요하다", "외부 전송·복사 기록을 남기고, 반출에는 승인 절차를 둔다"], a:3, ex:"반출 경로는 USB·메일·클라우드·화면촬영 등 다양하므로 한두 경로만 막는 식(③)의 관리는 뚫린다. 전송·복사 기록 + 승인 절차로 '누가 언제 무엇을 내보냈는지' 추적 가능하게 만드는 것이 실무 표준이다."},
  {q:"비밀유지계약(NDA) 체결에 관한 설명으로 옳은 것은?", o:["NDA는 필요하지만, 소송에서 이기려면 별도로 실제 합리적인 비밀관리 조치(표기·접근통제 등)를 증명해야한다", "NDA만 체결하면 비밀관리성이 자동으로 인정된다", "NDA가 있으면 직원의 무단 복사는 사전에 막아 준다", "NDA는 해외 파트너와 체결하면 효력이 없다"], a:0, ex:"NDA는 '약속'이고, 비밀관리성은 '실제 행동'을 본다. 계약만 있고 실제 관리가 없으면 법원은 영업비밀 성립을 부정할 수 있다(대법원 96다31574 법리). NDA는 예방장치이지 차단장치가 아니다(③)."},
  {q:"보존기간이 끝난 기밀 문서의 폐기 방법으로 올바른 것은?", o:["일반 쓰레기와 함께 배출한다", "재활용품 회수함에 넣는다", "복구가 불가능하도록 파쇄·소각 등의 방법으로 폐기한다", "전자파일은 '휴지통 비우기'만 하면 완전히 삭제된다"], a:2, ex:"쓰레기 배출은 그 자체가 유출 사고다. 종이는 복구 불가능한 파쇄로, 전자파일은 복구 가능성을없애는 삭제 절차를 거쳐야 한다. '휴지통 비우기'만으로는 복구 도구로 되살릴 수 있다(④ 오답)."},
  {q:"재택·원격근무 시 비밀관리로 바람직한 것은?", o:["편의상 개인 클라우드에 회사 자료를 백업해 둔다", "회사 정보는 회사가 승인한 시스템으로만 다루고, 개인 클라우드·개인기기 저장은 금지한다", "공용 와이파이에서 암호화 없이 회사 서버에 접속한다", "가족이 쓰는 PC 계정을 공유해 업무를 본다"], a:1, ex:"재택 환경에서는 '승인된 기기·시스템 사용'과 '개인 저장소 반출 금지'가 기본이다. 나머지는 모두 통제를 벗어난 경로라 유출 시 추적도 어렵다."},
  {q:"하청·협력업체에 기술자료를 전달해야 하는 경우 올바른 조치는?", o:["작업 편의를 위해 전체 설계 데이터를 통째로 넘겨 준다", "구두상의 부탁으로 충분하다", "협력사의 하급자에게도 똑같이 배포한다", "전달 범위를 최소화하고, 비밀유지의무·반환·폐기 조건을 계약서에 명시한다"], a:3, ex:"협력사 유출은 실무에서 매우 흔하다. 필요한 최소 범위만, 계약상 비밀유지의무와 목적 외 사용금지, 작업 종료 시 반환·폐기 조항까지 갖추어 전달해야 한다."},
  {q:"나중에 분쟁이 생겼을 때를 대비해 평소에 해 둘 일로 가장 적절한 것은?", o:["나중에 문제될 일이 없도록 정보에 관한 기록을 아예 남기지 않는다", "관리 기록은 담당자 개인 노트북에만 보관한다", "문서의 작성일자·작성자·수정 이력과 접속·이메일 기록 등 '관리 흔적'을 남겨 둔다", "유출이 확인된 뒤에 관리 기록을 몰아서 만들어 둔다"], a:2, ex:"분쟁에서는 '이 정보가 회사에서 비밀로 관리되고 있었다'는 사실을 증명해야 한다. 결재 문서, 이메일, 접속기록, 교육 이수 기록 같은 관리 흔적이 그 증거가 된다. 유출 후에 급조한 기록(④)은 신뢰성을 인정받기 어렵다."},
  {q:"직원 보안교육의 목적에 대한 설명으로 옳은 것은?", o:["직원이 '무엇이 영업비밀이고 어떻게 다뤄야 하는지' 알게 해 실수·무단반출을 줄이는 것이다", "교육은 형식적 의무이므로 자료만 걸어 두면 족하다", "교육 대상은 정보보안 담당자로 한정된다", "교육 자료에는 실제 핵심 비밀 정보를 예시로 첨부한다"], a:0, ex:"'모르고 유출'되는 사고를 줄이는 것이 교육의 목적이며, 이수 기록은 비밀관리 증거로도 쓰인다.교육자료에 실제 비밀을 담으면(④) 그 자체가 공개 범위를 넓히는 실수가 된다."},
  {q:"정보 열람 인원 관리에 관한 설명으로 옳은 것은?", o:["아무나 볼 수 있어도 회사가 '비밀'이라고 주장하면 영업비밀이다", "열람 인원이 수십 명이면 무조건 공개된 것으로 본다", "열람 기록은 남기지 않는 편이 나중에 회사에 유리하다", "열람 가능한 사람을 필요한 자로 한정하고 기밀 표시를 두면, 인원이 소수라는 점이 비밀관리성 판단에 유리하게 작용할 수 있다"], a:3, ex:"열람 인원 제한과 기밀 표기, 열람 기록은 비밀관리성의 전형적 증거다. 반대로 무제한 개방(①)은 비밀관리성 부정의 대표 사례다."},
  {q:"거래처·신규 인수자가 공장을 견학하러 올 때의 관리 방법으로 가장 적절한 것은?", o:["신뢰를 보여 주기 위해 공장 전체를 자유롭게 둘러보게 한다", "견학 구역과 시간을 정하고, 촬영 금지와 담당자 동행 등의 절차를 둔다", "홍보 겸해서 촬영을 자유롭게 허용한다", "방문자 명부는 작성하지 않는다"], a:1, ex:"견학은 '허용된 공개'이므로 범위 관리가 핵심이다. 견학 구역 지정, 촬영 금지, 동행 절차, 방문명부 작성까지 갖추면 나중에 '그 사람이 그때 봤다'는 증명도 가능해진다."},
  {q:"비밀유지계약에 '위약벌 5천만원' 조항만 넣었다면, 이것으로 비밀관리가 완성되었는가?", o:["위약벌 금액만 크면 비밀관리성이 인정된다", "위약벌 조항은 다툼이 있을 때만 쓰므로 평소 관리와는 무관하다", "아니다 — 위약벌은 위압 수단일 뿐이고, 접근통제·표기·교육 같은 실질적 비밀관리와 함께 갖추어야 영업비밀 보호가 완성된다", "위약벌 조항이 있으면 손해배상은 받을 수 없다"], a:2, ex:"계약조항은 필요조건이지 충분조건이 아니다. 법원은 실제 관리 행위(누가 볼 수 있었는지, 어떻게 표기·통제했는지)를 본다. 위약벌과 손해배상은 별개로 청구할 수 있다(④ 오답)."},
  {q:"퇴사자가 퇴사 직전 회사 PC에서 수천 개 파일을 USB로 복사한 흔적을 시스템 로그에서 발견했다. 가장 먼저 해야 할 조치는?", o:["해당 PC 등 증거가 될 물품의 전원·상태를 그대로 유지하고 조작을 중단한 뒤, 디지털 포렌식 전문가와 상의해보전한다", "즉시 포맷해서 다른 직원에게 넘겨 준다", "하루 종일 켜 둔 채 직접 폴더를 열어 하나하나 확인한다", "파일 몇 개를 메일로 전달받아 두면 증거는 충분하다"], a:0, ex:"유출 정황이 보이면 원본 보존이 1순위다. 부팅·열람·삭제 같은 조작은 타임스탬프와 흔적을 바꿔 놓는다. 원본 PC의 전원 상태를 유지한 채 전문가에게 넘겨 이미징(복제)부터 하는 것이 표준 절차다.2024년 개정으로 신설된 제9조의8(훼손·멸실·변경 금지)도 '증기를 없애지 말라'는 원칙을 뒷받침한다."},
  {q:"유출 의심 PC를 회사 직원이 임의로 재부팅하고 파일을 열어 보았다. 이로 인한 문제로 적절한 것은?", o:["재부팅해도 전자기기에는 아무런 변화가 없으므로 문제될 것이 없다", "원본 PC는 법적으로 아무 가치가 없으므로 상관없다", "복사본만 있으면 모든 법적 절차가 끝나므로 원본은 필요 없다", "파일 시스템 기록·타임스탬프 등이 변형·소실될 수 있고, 나중에 소송에서 증거의 신뢰성을 다투게 될 수 있다"], a:3, ex:"부팅 자체가 자동 실행·로그 갱신·캐시 삭제 등을 일으킨다. 원본이 훼손되면 '그 증거가 조작되지 않았는가'를 다투는 장이 되어, 사실상 이길 소송을 지게 만들 수 있다. 반대로 상대방이 우리 쪽 자료를훼손하면 제9조의8 위반으로 처벌된다(10년 이하 징역·5억원 이하 벌금)."},
  {q:"유출 의심 PC의 분석 절차로 바람직한 것은?", o:["원본을 직접 열어 필요해 보이는 파일만 골라 복사해 분석한다", "화면 캡처(스크린샷)만으로 대체한다", "원본을 봉인·보관하고, 원본과 동일한 복제본(이미지)을 만들어 해시값 등으로 동일성을 확인한 뒤 복제본을분석한다", "복제본을 여러 명이 나눠 가지되, 해시값 확인은 생략한다"], a:2, ex:"디지털 포렌식의 표준 절차다. 원본 봉인 → 이미징 → 해시값 기록(원본·복제본이 동일하다는증명) → 복제본만 분석. 해시값이 있어야 '복제 과정에서 내용이 바뀌지 않았다'는 것을 법원에 보여 줄 수있다."},
  {q:"특정 직원의 유출을 의심할 때, 함께 확보해 두면 좋은 자료는?", o:["당사자의 진술만으로 충분하다", "SNS 감정(코인·주식 투자 결과)만 하면 된다", "유출 시점 전후의 출입기록, 시스템 접속·다운로드 기록, 업무용 메일, 프린터 사용기록 등", "증거는 최소한으로만 남기는 것이 원칙이다"], a:2, ex:"'언제, 무엇에 접근했고, 무엇을 내보냈는지'를 보여 주는 기록이 곧 유출의 흐름을 증명한다. 이기록들은 로그 보존기간이 지나면 사라지므로, 의심 단계에서 서둘러 백업해 둔다."},
  {q:"회사의 핵심 기술이 해외 경쟁사로 유출되었다는 정황을 발견했다. 신고 제도에 대한 설명으로 옳은 것은?", o:["2026. 5. 28.부터 시행된 제도에 따라, 영업비밀 해외유출을 신고한 자는 사건당 최대 2억원의 포상금을 받을수 있다", "해외 유출은 신고해도 포상금이 없다", "포상금의 상한은 100만원이다", "포상금은 법인(회사)만 신청할 수 있다"], a:0, ex:"2026. 5. 28. 시행된 포상금 제도는 해외 영업비밀 유출 신고에 대해 사건당 최대 2억원을, 사건해결에 기여한 유공자에게는 500만원 이하의 포상을 지급한다. 개인·법인 모두 신고할 수 있다."},
  {q:"영업비밀 침해가 확인되었다. 피해 회사가 민사로 취할 수 있는 조치의 조합으로 옳은 것은?", o:["손해가 입증된 이후에야 어떤 청구든 할 수 있다", "형사 고소를 먼저 해야만 민사 청구가 가능하다", "침해금지 청구는 손해배상 소송이 끝난 뒤에만 가능하다", "침해금지·예방 청구, 손해배상 청구, 원상회복 청구 등을 할 수 있다(침해금지는 손해가 확정되지 않아도 가능)"], a:3, ex:"제4조의 침해금지·예방 청구는 '손해 발생 여부와 무관하게' 할 수 있어, 급한 유출에도 바로 쓸수 있다. 여기에 손해배상(제14조의2), 원상회복(제6조: 신용회복 조치 포함)을 더할 수 있다."},
  {q:"전직 임원이 경쟁사로 이직해 우리 핵심 기술을 '당장' 사용하려 한다. 본안 소송까지 기다릴 수 없다. 가장 적절한긴급 대응은?", o:["우리 기술의 내용을 언론에 공개해 버린다", "침해금지 가처분을 신청한다 — 단, 청구 취지와 비밀을 구체적으로 특정해야 한다", "상대방 서버에 직접 접속해 자료를 삭제한다", "경쟁사 거래처 전체에 내용증명을 일제히 발송해 공개한다"], a:1, ex:"본안 판결 전에도 당장의 사용·공시를 막기 위해 가처분을 신청할 수 있다. 다만 대법원 2011마1624는 가처분 단계에서도 비밀을 구체적으로 특정해야 한다고 본다 — '우리 회사의 모든 기술' 같은 막연한 주장은 안 된다. ①은 비밀을 스스로 없애는 행위이고 ③은 형사처벌(정보통신망법·형법) 문제가 된다."},
  {q:"영업비밀 유출에 대해 형사 대응을 하려고 한다. 올바른 설명은?", o:["고소는 법무법인 대표자만 할 수 있다", "영업비밀 유출은 형사처벌 대상이 아니다", "관할 경찰서·검찰에 영업비밀 침해(부정경쟁방지법 위반) 혐의로 고소할 수 있고, 지식재산처 특별사법경찰의수사 지원을 받을 수도 있다", "피해 회사가 직접 침해자를 체포해야 한다"], a:2, ex:"영업비밀 침해는 형사범죄다(자연인: 최대 10년·5억원, 해외유출: 15년·15억원). 피해자는 고소할 수 있고, 2025. 10. 1. 출범한 지식재산처(국무총리실 소속) 산하 특별사법경찰이 지식재산 범죄 수사를전담·지원한다."},
  {q:"영업비밀을 '해외로' 유출한 자에 대한 법정형은?", o:["15년 이하의 징역 또는 15억원 이하의 벌금", "3년 이하의 징역 또는 3천만원 이하의 벌금", "5년 이하의 징역 또는 5천만원 이하의 벌금", "20년 이하의 징역 또는 20억원 이하의 벌금"], a:0, ex:"국내 유출은 10년 이하 징역 또는 5억원 이하 벌금이지만, 해외 유출은 15년 이하 징역 또는 15억원 이하 벌금으로 두 배 가까이 무겁다. 침해로 얻은 이득액(국내 5억원, 해외 15억원)을 넘으면 벌금은 이득액의 2~10배로 늘어난다."},
  {q:"징벌적 손해배상 제도에 대한 설명으로 옳은 것은?", o:["배상은 항상 실제 손해만큼만 받을 수 있다", "침해가 확인되면 무조건 10배까지 배상된다", "징벌적 손해배상 제도는 도입되지 않았다", "고의성 등이 인정되는 엄중한 침해에서 법원이 실제 손실의 최대 5배까지 배상을 명할 수 있다"], a:3, ex:"제14조의2에 징벌적 손해배상이 있고, 2024. 8. 21. 개정으로 상한이 3배에서 5배로 올랐다(제14조의2 제6항). 악의적 유출(해외 반출, 조직적 침해)에는 실제 손해를 넘어서는 배상으로 응징할 수 있게된 것이다."},
  {q:"손해배상 청구권의 소멸시효(제14조)에 대한 설명으로 옳은 것은?", o:["침해가 있었더라도 시효 없이 언제든 청구할 수 있다", "손해 및 가해자를 안 날부터 3년, 침해행위가 있은 날부터 10년 이내에 청구해야 한다", "유출 사실을 알게 된 날부터 30일 이내에 청구해야 한다", "가해자를 안 날부터 10년이 지나도 항상 청구할 수 있다"], a:1, ex:"제14조에 따라 안 날부터 3년(주관적 기준) 또는 행위 시점부터 10년(객관적 기준)이면 청구권이소멸한다. 유출을 늦게 발견하더라도 행위 시점부터 10년이 지나면 못 받는다는 뜻이므로, 정황을 발견하면빨리 대응해야 한다."},
  {q:"소송 중 법원이 내리는 '비밀유지명령'을 위반한 자에 대한 형량은?", o:["1년 이하의 징역 또는 300만원 이하의 벌금", "10년 이하의 징역 또는 5억원 이하의 벌금", "5년 이하의 징역 또는 5천만원 이하의 벌금", "15년 이하의 징역 또는 15억원 이하의 벌금"], a:2, ex:"비밀유지명령은 소송에서 영업비밀이 기록·증거로 열리는 상황에서 2차 유출을 막기 위해 당사자·이해관계인에게 그 영업비밀을 사용·개시하지 못하게 하는 법원의 명령이다. 위반하면 5년 이하 징역 또는 5천만원 이하 벌금(제18조의4). ②는 일반 침해죄의 형량이다."},
  {q:"소송에서 상대방이 제출한 자료에 우리 영업비밀이 담겨 있을 때 활용할 수 있는 '자료열람 제한'(제7조의2) 제도의 취지는?", o:["소송 기록에 담긴 영업비밀의 2차 유출을 막기 위해 상대방 등의 열람·등사를 제한할 수 있다", "공정을 위해 상대방에게 모든 자료를 반드시 공개해야 한다", "법원 직원만 자료를 열람할 수 있다", "이런 제도는 아직 도입되지 않았다"], a:0, ex:"소송을 하다가 비밀이 재판 기록을 통해 새로 유출되는 문제를 막기 위한 제도다(2024. 8. 21. 개정 신설). 실무에서는 자료열람신청서 접수를 알리는 통지 → 열람 대상자 지정 등의 절차로 운영된다."},
  {q:"관할 기관(특허청 → 현 지식재산처)이 내린 '시정명령'을 위반하면 어떻게 되는가?", o:["아무 제재도 없다", "과태료의 상한은 100만원이다", "시정명령이라는 행정처분 제도 자체가 없다", "이행강제 성격의 과태료(최대 2천만원)가 부과될 수 있다"], a:3, ex:"침해행위에 대해 시정명령(제8조)을 내릴 수 있고, 정당한 사유 없이 이행하지 않으면 과태료(최대 2천만원)가 부과된다(제20조). 행정적 시정 명령, 형사 고소, 민사 청구가 병행될 수 있다."},
  {q:"대법원 2017도13792(도매점 개방 사건)의 취지로 옳은 것은?", o:["도매점에 전시된 정보도 무조건 영업비밀이다", "사업자가 스스로 도매점 등 공개된 장소에서 누구나 볼 수 있도록 놓아둔 제품 정보는, 그 사업자가 '비밀'이라고 주장하더라도 비밀관리성이 부정될 수 있다", "고객이 촬영한 사진은 항상 처벌 대상이다", "도매점 개방 관련 규제는 존재하지 않는다"], a:1, ex:"자기가 공개한 정보는 비밀관리 여지가 없다. 이 판결은 '비밀관리성'을 실질적으로 판단하는 대표 판례로, 사내 대장·계약서에서만 다뤄지던 정보라도 영업상 공개 경로로 내놓았다면 보호가 어렵다는 취지다."},

/* ==== 문항 은행 끝 ==== */

/* ══════════ 유틸 ══════════ */
const $ = id => document.getElementById(id);
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(id){
  ["screen-start","screen-quiz","screen-result"].forEach(s => $(s).hidden = (s !== id));
  document.body.classList.toggle("mode-start", id === "screen-start");
window.scrollTo(0, 0);
}

/* ══════════ 출제 : 4개 영역 균형 + 무작위 10문항 ══════════ */
function buildSession(){
  const pool = Array.isArray(BANK) ? BANK.slice() : Object.values(BANK).flat();
  return shuffle(pool).slice(0, 10).map(it => ({
    cat: it.cat,
    text: it.q,
    ex: it.ex,
    options: shuffle(it.o),
    correct: it.o[it.a]   // 정답 내용으로 추적
  }));
}

/* ══════════ 세션 상태 ══════════ */
let S = null;

function startQuiz(){
  S = { qs: buildSession(), i: 0, answers: [] };
  renderQ();
  show("screen-quiz");
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = (S.i + 1) + " / " + S.qs.length;
  $("progress-fill").style.width = (S.i / S.qs.length * 100) + "%";
  $("q-text").textContent = q.text;
  const box = $("q-options");
  box.innerHTML = "";
  const marks = ["①","②","③","④"];
  q.options.forEach((opt, idx) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    const no = document.createElement("span"); no.className = "opt-no"; no.textContent = marks[idx];
    const tx = document.createElement("span"); tx.className = "opt-tx"; tx.textContent = opt;
    b.append(no, tx);
    b.addEventListener("click", () => answer(idx));
    box.appendChild(b);
  });
  $("q-explain").hidden = true;
  $("btn-next").hidden = true;
  if(S.answers[S.i] != null){ applyAnswered(); }
  else { $("btn-back").hidden = true; }
}

function applyAnswered(){
  const q = S.qs[S.i];
  const idx = S.answers[S.i];
  if(idx == null) return;
  const ci = q.options.indexOf(q.correct);
  const ok = idx === ci;
  fillExplainAnswers(q, idx, ok, ci);
  [...$("q-options").children].forEach((b, bi) => {
    b.disabled = true;
    if(bi === ci) b.classList.add("is-correct");
    if(!ok && bi === idx) b.classList.add("is-wrong");
  });
  const tag = $("explain-tag");
  tag.textContent = ok ? "정답입니다" : "아쉽네요, 오답입니다";
  tag.className = ok ? "ok" : "bad";
  $("explain-text").textContent = q.ex;
  $("q-explain").hidden = false;
  const next = $("btn-next");
  next.hidden = false;
  next.textContent = S.i === S.qs.length - 1 ? "결과 보기" : "다음 문제";
  $("progress-fill").style.width = ((S.i + 1) / S.qs.length * 100) + "%";
  $("btn-back").hidden = (S.i === 0);
}

function answer(idx){
  if(S.answers[S.i] != null) return;
  S.answers[S.i] = idx;
  applyAnswered();
}

$("btn-next").addEventListener("click", () => {
  if(S.i < S.qs.length - 1){ S.i++; renderQ(); }
  else showResult();
});

$("btn-back").addEventListener("click", () => {
  if(S && S.i > 0){ S.i--; renderQ(); }
});

$("btn-back-result").addEventListener("click", () => {
  if(!S) return;
  S.i = S.qs.length - 1;
  renderQ();
  show("screen-quiz");
});

/* ══════════ 결과 ══════════ */
/* ==== 점수 구간 시작 ==== */
const GRADE_TIERS = [{"min":10,"t":"완벽해요","low":false,"m":"만점입니다. 이대로 쭉!"},{"min":8,"t":"참 잘했어요","low":false,"m":"거의 다 왔어요! 틀린 부분의 개념만 살짝 다시 보면 정말 완벽해요."},{"min":5,"t":"조금 더 힘내볼까요?","low":false,"m":"절반을 넘겼으니, 문제풀이를 한 번 더 차분히 반복하며 약점을 튼튼히 다져요."},{"min":1,"t":"기초부터 차근차근!","low":true,"m":"문제풀이 과정을 천천히 복습하며 하나씩 확실하게 익혀가요."},{"min":0,"t":"새로운 시작 함께해요!","low":true,"m":"기본부터 다시 해봐요."}];
/* ==== 점수 구간 끝 ==== */
function gradeOf(score, total){
  const g = GRADE_TIERS.find(x => score >= x.min) || GRADE_TIERS[GRADE_TIERS.length - 1];
  return {t:g.t, low:!!g.low, m:g.m};
}

function fillExplainAnswers(q, idx, ok, ci){
  const ea = $("explain-answers");
  if(ok){ ea.innerHTML = ""; ea.hidden = true; return; } /* 정답: 태그+해설만 */
  ea.innerHTML = "";
  const marks = ["①","②","③","④"];
  const p = document.createElement("div"); p.className = "ea-line ea-ok";
  const b = document.createElement("b"); b.textContent = "정답 " + marks[ci];
  p.appendChild(b); p.appendChild(document.createTextNode(" " + q.options[ci]));
  ea.appendChild(p);
  ea.hidden = false;
}

function showResult(){
  let score = 0;
  S.qs.forEach((q, i) => { if(q.options[S.answers[i]] === q.correct) score++; });

  $("score-num").textContent = score;
  $("score-max").textContent = S.qs.length;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("ring-fg").style.strokeDashoffset = 326.7 * (1 - (S.qs.length ? score / S.qs.length : 0));
  }));

  const g = gradeOf(score, S.qs.length);
  const stamp = $("grade-stamp");
  stamp.textContent = g.t;
  stamp.classList.toggle("low", g.low);
  $("grade-msg").textContent = g.m;

  show("screen-result");
}

/* ══════════ 이벤트 ══════════ */
$("btn-start").addEventListener("click", startQuiz);
$("btn-retry").addEventListener("click", startQuiz);
$("btn-home").addEventListener("click", () => show("screen-start"));

document.body.classList.add("mode-start");

/* 렌더링 검사용 파라미터 (실사용 시 무시됨) */
const __p = new URLSearchParams(location.search).get("preview");
if(__p === "quiz"){ startQuiz(); }
if(__p === "result"){
  startQuiz();
  S.qs.forEach((q, i) => { S.answers[i] = (i % 3 === 0) ? q.options.indexOf(q.correct) : Math.floor(Math.random() * 4); });
  showResult();
}
</script>
